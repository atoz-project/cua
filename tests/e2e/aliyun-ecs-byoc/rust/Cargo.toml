[package]
name = "aliyun-ecs-byoc-e2e"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Opaque-box E2E test suite for Alibaba Cloud ECS (aliyun-ecs) BYOC and per-connection self-hosted relay."

[dependencies]
cua-byoc = { path = "../../../../libs/cua/crates/cua-byoc", features = ["aliyun-ecs"] }
cua-host = { path = "../../../../libs/cua/crates/cua-host", features = ["testing"] }
cua-sdk = { path = "../../../../libs/cua/crates/cua-sdk" }
cua-spacesd-client = { path = "../../../../libs/cua/crates/cua-spacesd-client", features = ["testing"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json", "query", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
url = "2.5"

# Standalone workspace: independent of libs/cua, purely MIT-licensed.
[workspace]
